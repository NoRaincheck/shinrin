[project]
name = "shinrin"
version = "0.1.0"
description = "Shinrin (Forest) - An ML library for decision tree and related extensions"
readme = "README.md"
authors = [
    { name = "NoRaincheck", email = "2498638+NoRaincheck@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "scipy>=1.14",
    "joblib>=1.4",
]

[project.optional-dependencies]
mojo = [
    "mojo>=1.0.0",
]
# Metal (Apple GPU) backends via Mojo GPU kernels; requires Xcode 26+ with
# the Metal Toolchain component (`xcodebuild -downloadComponent MetalToolchain`)
metal = [
    "mojo>=1.0.0",
    "max>=26.5",
]
sklearn = [
    "scikit-learn>=1.7",
]
pandas = [
    "pandas>=2.2",
]
full = [
    "scikit-learn>=1.7",
    "pandas>=2.2",
]
# Optional deps for running the TabM PyTorch reference benchmark
# (scripts/benchmarks/bench_tabm.py --with-torch)
tabm-bench = [
    "torch>=2.0",
    "lightning>=2.0",
    "tabm",
    "rtdl-num-embeddings",
]
# "full+mojo" installs everything including the Mojo backend

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "shinrin._native"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]
docs = [
    "mkdocs-material>=9.6",
]

[tool.ruff]
extend-exclude = [
    "src/shinrin/_skgarden",
    "src/shinrin/_skrules",
    "tests/vendored",
    "src/shinrin/_compat.py",
]
